user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 20G;
    client_body_timeout 7200s;
    client_header_timeout 60s;
    send_timeout 7200s;

    server {
        listen 1080 default_server;
        listen [::]:1080 default_server;
        server_name _;

        location = /health {
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/upload-ca.crt;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name 117.139.126.166;
            proxy_set_header Host 117.139.126.166;
            proxy_pass https://117.139.126.166:10443;
        }

        location /api/v1/upload/ {
            client_max_body_size 20G;
            client_body_timeout 7200s;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/upload-ca.crt;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name 117.139.126.166;
            proxy_set_header Host 117.139.126.166;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-File-SHA256 $http_x_file_sha256;
            proxy_pass https://117.139.126.166:10443;
        }

        location / { return 404; }
    }
}
